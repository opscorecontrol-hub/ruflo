events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;

  # Use Docker's embedded DNS so hostnames resolve per-request, not at startup
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Rate limiting — 60 requests/minute per IP for API routes
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

  server {
    listen 80;
    server_name _;

    # ── Ruflo Chat UI ─────────────────────────────────────────────────────────
    location /chat/ {
      rewrite ^/chat/(.*)$ /$1 break;
      set $chat_upstream http://ruflo-chat-ui:3000;
      proxy_pass $chat_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── OpsCore API ───────────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=30 nodelay;
      set $api_upstream http://opscore-backend:3003;
      proxy_pass $api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── WebSocket upgrade ─────────────────────────────────────────────────────
    location /ws {
      set $ws_upstream http://opscore-backend:3003;
      proxy_pass $ws_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400s;
    }

    # ── Health check (unauthenticated) ────────────────────────────────────────
    location /health {
      set $health_upstream http://opscore-backend:3003;
      proxy_pass $health_upstream;
    }

    # ── OpsCore frontend SPA (catch-all) ──────────────────────────────────────
    location / {
      set $frontend_upstream http://opscore-frontend:4000;
      proxy_pass $frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
